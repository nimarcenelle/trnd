<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 1080×1920, loops every 10s. R restarts, space pauses, ?t=4 freezes at 4s. */
:root{--bg:#f7f5f8;--surface:#fff;--muted:#efebf1;--line:#e1dce5;--ink:#17131b;--ink-2:#625b6a;--ink-3:#8f879a;--brand:#e0245e;--brand-soft:#fde6ee;--brand-dk:#ff5c8a;--cyan-dk:#45c6d8;--night:#1d1724;--D:10s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;font-family:Figtree,system-ui,sans-serif;color:var(--ink)}
#fit{width:calc(1080px * var(--s,1));height:calc(1920px * var(--s,1));position:relative}
#stage{position:absolute;inset:0 auto auto 0;width:1080px;height:1920px;transform:scale(var(--s,1));transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage.go{animation:clock var(--D) linear infinite}
@keyframes clock{to{outline-color:transparent}}
.go *{animation-duration:var(--D);animation-iteration-count:infinite;animation-timing-function:ease-in-out}

/* On-screen text, readable with the sound off */
.ov{position:absolute;left:80px;right:80px;top:190px;text-align:center;font:600 58px/1.32 Unbounded,sans-serif;opacity:0}
.ov span{background:var(--surface);color:var(--ink);padding:4px 22px;border-radius:18px;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:0 10px 30px rgba(23,19,27,.08)}
.ov b{color:var(--brand);font-weight:800}
.go .ov1{animation-name:ov1}
.go .ov2{animation-name:ov2}
@keyframes ov1{0%,45%{opacity:1;transform:none}48%,96%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:none}}
@keyframes ov2{0%,47%{opacity:0;transform:translateY(14px)}51%,94%{opacity:1;transform:none}97%,100%{opacity:0}}

/* The post (a 9:16 video in a phone-sized frame) */
.frame{position:absolute;left:220px;top:420px;width:640px;height:1138px;border-radius:44px;overflow:hidden;background:var(--night);box-shadow:0 40px 90px rgba(23,19,27,.22)}
.post{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 35%,#3a2b47 0%,#1d1724 70%)}
.desk{position:absolute;left:0;right:0;top:560px;height:260px;background:linear-gradient(#c9a37a,#a9825b);transform:perspective(600px) rotateX(38deg);transform-origin:top;opacity:.9}
.icons{position:absolute;left:40px;right:40px;top:600px;display:flex;justify-content:space-between}
.icon{width:70px;height:70px;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:grid;place-items:center;font:800 30px Unbounded,sans-serif;color:#fff}
.icon:nth-child(1){background:#6d5bd0}.icon:nth-child(2){background:#f0a33a}.icon:nth-child(3){background:#2fa36b}
.icon:nth-child(4){background:#e0245e}.icon:nth-child(5){background:#3a86d8}.icon:nth-child(6){background:#d04fb0}.icon:nth-child(7){background:#e4643a}
.go .flick{animation-name:flick}
.flick:nth-child(1){--x:-160px;--r:-50deg}.flick:nth-child(3){--x:-60px;--r:40deg}.flick:nth-child(5){--x:60px;--r:-35deg}
.flick:nth-child(6){--x:120px;--r:55deg}.flick:nth-child(7){--x:180px;--r:-45deg}
@keyframes flick{0%,14%{transform:none;opacity:1}24%,90%{transform:translate(var(--x),-560px) rotate(var(--r));opacity:0}91%,100%{transform:none;opacity:1}}
.go .keep{animation-name:keep}
@keyframes keep{0%,24%{transform:none}29%,40%{transform:translateY(-16px) scale(1.18)}44%,100%{transform:none}}
.hook{position:absolute;left:44px;right:44px;top:150px;text-align:center;color:#fff;font:600 42px/1.28 Unbounded,sans-serif;text-shadow:0 3px 18px rgba(0,0,0,.45)}
.hook b{color:var(--brand-dk);font-weight:800}
.pill{position:absolute;left:32px;top:36px;display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font:800 28px Figtree,sans-serif}
.pill i{width:14px;height:14px;border-radius:50%;background:var(--brand)}
.go .pill{animation-name:pulse}
@keyframes pulse{0%,4%{transform:none}8%{transform:scale(1.1)}12%,100%{transform:none}}
.meta{position:absolute;left:36px;right:36px;bottom:44px;color:#fff}
.handle{font:700 32px Figtree,sans-serif}
.cap{margin-top:10px;font:400 27px/1.35 Figtree,sans-serif;opacity:.92}
.tags{margin-top:8px;font:500 25px 'JetBrains Mono',monospace;color:var(--cyan-dk)}

/* The record screen */
.rec{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,#4a4150 0%,#221c27 80%);transform:translateY(105%)}
.go .rec{animation-name:rec}
@keyframes rec{0%,45%{transform:translateY(105%);opacity:1}52%,94%{transform:none;opacity:1}99%{transform:none;opacity:0}100%{transform:translateY(105%);opacity:0}}
.grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.12) 33.3%,rgba(255,255,255,.12) 33.5%,transparent 33.6%,transparent 66.5%,rgba(255,255,255,.12) 66.6%,rgba(255,255,255,.12) 66.8%,transparent 66.9%),linear-gradient(transparent 33.2%,rgba(255,255,255,.12) 33.3%,rgba(255,255,255,.12) 33.45%,transparent 33.6%,transparent 66.5%,rgba(255,255,255,.12) 66.6%,rgba(255,255,255,.12) 66.75%,transparent 66.9%)}
.subject{position:absolute;left:50%;top:520px;width:300px;height:620px;margin-left:-150px;border-radius:150px 150px 40px 40px;background:linear-gradient(#5a4f61,#3a3240);opacity:.8}
.subject:before{content:"";position:absolute;left:75px;top:-170px;width:150px;height:150px;border-radius:50%;background:#5a4f61}
.prompter{position:absolute;left:28px;right:28px;top:110px;padding:26px 28px 30px;border-radius:24px;background:rgba(10,8,12,.62)}
.plabel{font:600 22px Figtree,sans-serif;color:rgba(255,255,255,.62);margin-bottom:12px}
.pline{font:600 40px/1.3 Unbounded,sans-serif;color:rgba(255,255,255,.5)}
.pline .on{color:#fff}
.pline .now{color:var(--brand-dk)}
.timer{position:absolute;left:0;right:0;top:46px;text-align:center;font:700 28px 'JetBrains Mono',monospace;color:#fff}
.timer i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brand-dk);margin-right:10px;opacity:0;vertical-align:2px}
.timer.live i{opacity:1}
.btn{position:absolute;left:50%;bottom:80px;width:150px;height:150px;margin-left:-75px;border-radius:50%;border:9px solid #fff}
.btn:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--brand);transition:all .35s ease}
.btn.live:after{inset:36px;border-radius:14px}
.roll{position:absolute;left:70px;bottom:108px;width:84px;height:84px;border-radius:16px;border:4px solid #fff;background:linear-gradient(135deg,#6d5bd0,#e0245e)}
.flip{position:absolute;right:70px;bottom:118px;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="ov ov1"><span>This TikTok<br><b>doesn&#39;t exist yet.</b></span></div>
  <div class="ov ov2"><span>The app wrote it.<br><b>I just film it.</b></span></div>

  <div class="frame">
    <div class="post">
      <div class="desk"></div>
      <div class="icons">
        <div class="icon flick">7</div><div class="icon keep">6</div><div class="icon flick">5</div>
        <div class="icon keep">4</div><div class="icon flick">3</div><div class="icon flick">2</div><div class="icon flick">1</div>
      </div>
      <div class="hook">I tested 7 AI study tools for a week. <b>Only 2 are worth it.</b></div>
      <div class="pill"><i></i>Not posted yet</div>
      <div class="meta">
        <div class="handle">＠marlow.studies</div>
        <div class="cap">One week, 7 tools, real homework. Tell me what to test next.</div>
        <div class="tags">#studytok #aitools #studyhacks</div>
      </div>
    </div>

    <div class="rec">
      <div class="grid"></div>
      <div class="subject"></div>
      <div class="timer" id="timer"><i></i><span>0:00</span></div>
      <div class="prompter">
        <div class="plabel">Your hook, 0–2s</div>
        <div class="pline" id="pline"></div>
      </div>
      <div class="roll"></div>
      <div class="btn" id="btn"></div>
      <div class="flip"></div>
    </div>
  </div>
</div></div>

<script>
const D=10000,stage=document.getElementById('stage');
const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1920));
addEventListener('resize',fit);fit();
let ref;const all=()=>document.getAnimations();
const seek=ms=>all().forEach(a=>a.currentTime=ms);
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){seek(0);all().forEach(a=>a.play())}
  if(e.code==='Space'&&ref){e.preventDefault();const p=ref.playState==='paused';all().forEach(a=>p?a.play():a.pause())}
});

const words='I tested 7 AI study tools for a week. Only 2 are worth it.'.split(' ');
const pline=document.getElementById('pline');
pline.innerHTML=words.map(w=>`<span>${w}</span>`).join(' ');
const spans=[...pline.children],timer=document.getElementById('timer'),btn=document.getElementById('btn');
function frame(ms){
  const live=ms>6000&&ms<9500;
  timer.classList.toggle('live',live);btn.classList.toggle('live',live);
  timer.lastChild.textContent='0:0'+(live?Math.floor((ms-6000)/1000):0);
  const k=Math.floor((ms-6300)/(2700/words.length));
  spans.forEach((s,i)=>s.className=i<k?'on':i===k?'now':'');
}

document.fonts.ready.then(()=>{
  stage.classList.add('go');ref=stage.getAnimations()[0];
  const q=parseFloat(new URLSearchParams(location.search).get('t'));
  if(!isNaN(q)){seek(q*1000);all().forEach(a=>a.pause())}
  requestAnimationFrame(function loop(){frame((ref.currentTime||0)%D);requestAnimationFrame(loop)});
});
</script>
</body>
</html>
