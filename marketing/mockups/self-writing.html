<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-writing post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 1080×1920, loops every 10s. R restarts, space pauses, ?t=7 freezes at 7s. */
:root{--bg:#f7f5f8;--surface:#fff;--muted:#efebf1;--line:#e1dce5;--ink:#17131b;--ink-2:#625b6a;--ink-3:#8f879a;--brand:#e0245e;--brand-soft:#fde6ee;--cyan:#0b8fa3;--cyan-soft:#def3f6;--night:#1d1724;--D:10s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;font-family:Figtree,system-ui,sans-serif;color:var(--ink)}
#fit{width:calc(1080px * var(--s,1));height:calc(1920px * var(--s,1));position:relative}
#stage{position:absolute;inset:0 auto auto 0;width:1080px;height:1920px;transform:scale(var(--s,1));transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage.go{animation:clock var(--D) linear infinite}
@keyframes clock{to{outline-color:transparent}}
.go *{animation-duration:var(--D);animation-iteration-count:infinite;animation-timing-function:ease-in-out}

.ov{position:absolute;left:80px;right:80px;top:190px;text-align:center;font:600 58px/1.32 Unbounded,sans-serif;opacity:0}
.ov span{background:var(--surface);color:var(--ink);padding:4px 22px;border-radius:18px;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:0 10px 30px rgba(23,19,27,.08)}
.ov b{color:var(--brand);font-weight:800}
.go .ov1{animation-name:ov1}
.go .ov2{animation-name:ov2}
@keyframes ov1{0%,63%{opacity:1;transform:none}66%,96%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:none}}
@keyframes ov2{0%,65%{opacity:0;transform:translateY(14px)}69%,94%{opacity:1;transform:none}97%,100%{opacity:0}}

/* The upload screen */
.screen{position:absolute;left:150px;top:420px;width:780px;height:1180px;border-radius:44px;background:var(--surface);border:1px solid var(--line);box-shadow:0 40px 90px rgba(23,19,27,.14);padding:40px 44px}
.top{display:flex;align-items:center;justify-content:center;position:relative;font:800 32px Figtree,sans-serif;margin-bottom:40px}
.top:before{content:"‹";position:absolute;left:0;top:-8px;font:400 52px Figtree,sans-serif;color:var(--ink-2)}
.row{display:flex;gap:26px}
.cover{flex:none;width:220px;height:293px;border-radius:14px;background:linear-gradient(160deg,#3a2b47,#1d1724);padding:16px;color:#fff;font:600 22px/1.3 Unbounded,sans-serif}
.cover b{color:#ff5c8a;font-weight:800}
.well{flex:1;min-height:293px;border-radius:10px;background:var(--muted);padding:22px 24px;font:700 38px/1.32 Figtree,sans-serif;outline:4px solid transparent}
.ph{color:var(--ink-3);font-weight:400}
.label{margin:54px 0 18px;font:600 30px Figtree,sans-serif;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:14px;min-height:78px}
.chip{display:inline-flex;align-items:center;height:78px;padding:0 26px;border-radius:999px;background:var(--cyan-soft);color:var(--cyan);font:700 34px 'JetBrains Mono',monospace}
.when{display:flex;align-items:center;justify-content:space-between;height:116px;padding:0 20px 0 32px;border-radius:999px;border:1px solid var(--line);outline:4px solid transparent}
.when .k{font:600 32px Figtree,sans-serif;color:var(--ink-2)}
.when .v{display:inline-flex;align-items:center;height:80px;min-width:20px;padding:0 28px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font:800 40px Figtree,sans-serif}
.when .v:empty{background:transparent}
.post{position:absolute;left:44px;right:44px;bottom:44px;height:110px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 38px Figtree,sans-serif}
.go .post{animation-name:post}
@keyframes post{0%,79%{transform:none;box-shadow:none}83%{transform:scale(1.05);box-shadow:0 0 0 12px var(--brand-soft),0 18px 40px rgba(224,36,94,.4)}86%{transform:scale(.97)}89%,100%{transform:none;box-shadow:0 0 0 0 var(--brand-soft)}}
.caret{display:inline-block;width:4px;height:1.05em;margin-left:3px;vertical-align:-.15em;background:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.active{outline-color:var(--brand)!important}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="ov ov1"><span>I didn't type<br><b>any of this.</b></span></div>
  <div class="ov ov2"><span>Not even<br><b>when to post.</b></span></div>

  <div class="screen">
    <div class="top">New post</div>
    <div class="row">
      <div class="cover">I tested 7 AI study tools for a week. <b>Only 2 are worth it.</b></div>
      <div class="well" id="cap"></div>
    </div>
    <div class="label">Hashtags</div>
    <div class="tags typed" id="tags"></div>
    <div class="label">When to post</div>
    <div class="when" id="whenrow"><span class="k">Schedule</span><span class="v typed" id="when"></span></div>
    <div class="post">Post</div>
  </div>
</div></div>

<script>
const D=10000,stage=document.getElementById('stage');
const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1920));
addEventListener('resize',fit);fit();
let ref;const all=()=>document.getAnimations();
const seek=ms=>all().forEach(a=>a.currentTime=ms);
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){seek(0);all().forEach(a=>a.play())}
  if(e.code==='Space'&&ref){e.preventDefault();const p=ref.playState==='paused';all().forEach(a=>p?a.play():a.pause())}
});

const CAP='One week, 7 tools, real homework. Tell me what to test next.';
const TAGS=['#studytok','#aitools','#studyhacks'],TAGS_LEN=TAGS.join('').length;
const WHEN='Tuesday, 5:30 PM';
const cap=document.getElementById('cap'),tags=document.getElementById('tags'),when=document.getElementById('when'),whenrow=document.getElementById('whenrow');
const caret='<span class="caret"></span>';
const n=(ms,from,to,len)=>Math.max(0,Math.min(len,Math.floor((ms-from)/(to-from)*len)));
let last='';
function frame(ms){
  const c=n(ms,900,4100,CAP.length),t=n(ms,4400,6100,TAGS_LEN),w=n(ms,6500,7600,WHEN.length);
  const on=ms<4300?'cap':ms<6400?'tags':ms<7900?'when':'';
  const fade=ms>9300?Math.max(0,1-(ms-9300)/400):1;
  const key=[c,t,w,on,fade.toFixed(2)].join();
  if(key===last)return;last=key;
  cap.innerHTML=(c?CAP.slice(0,c):on==='cap'?'':'<span class="ph">Add a caption…</span>')+(on==='cap'?caret:'');
  let left=t,html='';
  for(const tag of TAGS){if(left<=0)break;html+=`<span class="chip">${tag.slice(0,left)}</span>`;left-=tag.length}
  tags.innerHTML=html+(on==='tags'?caret:'');
  when.innerHTML=WHEN.slice(0,w)+(on==='when'?caret:'');
  [cap,tags,when].forEach(el=>el.style.opacity=fade);
  cap.classList.toggle('active',on==='cap');whenrow.classList.toggle('active',on==='when');
}

document.fonts.ready.then(()=>{
  stage.classList.add('go');ref=stage.getAnimations()[0];
  const q=parseFloat(new URLSearchParams(location.search).get('t'));
  if(!isNaN(q)){seek(q*1000);all().forEach(a=>a.pause())}
  requestAnimationFrame(function loop(){frame((ref.currentTime||0)%D);requestAnimationFrame(loop)});
});
</script>
</body>
</html>
