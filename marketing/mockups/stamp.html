<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>48-hour stamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 1080×1920, loops every 10s. R restarts, space pauses, ?t=7 freezes at 7s. */
:root{--bg:#f7f5f8;--surface:#fff;--muted:#efebf1;--line:#e1dce5;--ink:#17131b;--ink-2:#625b6a;--ink-3:#8f879a;--brand:#e0245e;--brand-soft:#fde6ee;--pos:#16804a;--pos-bg:#e2f4e9;--night:#1d1724;--D:10s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;font-family:Figtree,system-ui,sans-serif;color:var(--ink)}
#fit{width:calc(1080px * var(--s,1));height:calc(1920px * var(--s,1));position:relative}
#stage{position:absolute;inset:0 auto auto 0;width:1080px;height:1920px;transform:scale(var(--s,1));transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage.go{animation:clock var(--D) linear infinite}
@keyframes clock{to{outline-color:transparent}}
.go *{animation-duration:var(--D);animation-iteration-count:infinite;animation-timing-function:ease-in-out}

.ov{position:absolute;left:80px;right:80px;top:190px;text-align:center;font:600 58px/1.32 Unbounded,sans-serif;opacity:0}
.ov span{background:var(--surface);color:var(--ink);padding:4px 22px;border-radius:18px;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:0 10px 30px rgba(23,19,27,.08)}
.ov b{color:var(--brand);font-weight:800}
.go .ov1{animation-name:ov1}
.go .ov2{animation-name:ov2}
@keyframes ov1{0%,17%{opacity:1;transform:none}20%,96%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:none}}
@keyframes ov2{0%,19%{opacity:0;transform:translateY(14px)}23%,94%{opacity:1;transform:none}97%,100%{opacity:0}}

/* The posted video */
.card{position:absolute;left:210px;top:430px;width:660px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:0 30px 80px rgba(23,19,27,.14)}
.go .card{animation-name:shake;animation-timing-function:linear}
@keyframes shake{0%,59.5%{transform:none}60.2%{transform:translate(-10px,6px)}60.9%{transform:translate(9px,-5px)}61.6%{transform:translate(-5px,3px)}62.3%,100%{transform:none}}
.cover{position:relative;height:780px;background:radial-gradient(120% 70% at 50% 35%,#3a2b47 0%,#1d1724 70%);padding:56px 48px;color:#fff;font:600 46px/1.28 Unbounded,sans-serif;text-align:center}
.cover b{color:#ff5c8a;font-weight:800}
.info{display:flex;align-items:center;gap:22px;padding:28px 32px}
.av{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#6d5bd0,#e0245e)}
.h{font:700 32px Figtree,sans-serif}
.when{margin-top:4px;font:600 26px Figtree,sans-serif;color:var(--ink-3)}
.pill{margin-left:auto;padding:10px 22px;border-radius:999px;background:var(--muted);color:var(--ink-2);font:800 24px Figtree,sans-serif}

/* 48-hour clock */
.clock{position:absolute;left:50%;top:330px;width:400px;height:400px;margin-left:-200px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p,0) * 1turn),rgba(255,255,255,.25) 0);display:grid;place-items:center;opacity:0}
.clock:before{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--surface)}
.go .clock{animation-name:clk}
@keyframes clk{0%,15%{opacity:0;transform:scale(.6)}19%,52%{opacity:1;transform:none}56%,100%{opacity:0;transform:scale(.9)}}
.hand{position:absolute;left:50%;top:50%;width:8px;height:130px;margin:-130px 0 0 -4px;border-radius:999px;background:var(--ink);transform-origin:50% 100%}
.hub{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--brand)}
.read{position:relative;margin-top:190px;text-align:center}
.read b{display:block;font:800 60px Unbounded,sans-serif;color:var(--ink)}
.read span{font:700 22px Figtree,sans-serif;color:var(--ink-3)}

/* The stamp */
.stamp{position:absolute;left:50%;top:310px;width:600px;margin-left:-300px;padding:30px 0 34px;text-align:center;border:12px solid var(--pos);border-radius:28px;background:rgba(226,244,233,.94);color:var(--pos);opacity:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cover .stamp b{display:block;white-space:nowrap;color:var(--pos);font:800 92px/1.05 Unbounded,sans-serif}
.stamp span{display:block;margin-top:10px;font:800 34px Figtree,sans-serif}
.go .stamp{animation-name:stamp;animation-timing-function:cubic-bezier(.3,0,.4,1)}
@keyframes stamp{0%,57%{opacity:0;transform:rotate(-10deg) scale(2.4)}60%{opacity:1;transform:rotate(-10deg) scale(.94)}62%{transform:rotate(-10deg) scale(1.03)}64%,93%{opacity:1;transform:rotate(-10deg) scale(1)}97%,100%{opacity:0;transform:rotate(-10deg) scale(1)}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="ov ov1"><span>Posted the video<br><b>it told me to make.</b></span></div>
  <div class="ov ov2"><span><b>48 hours</b> later.</span></div>

  <div class="card">
    <div class="cover">I tested 7 AI study tools for a week. <b>Only 2 are worth it.</b>
      <div class="clock" id="clock"><div class="hand" id="hand"></div><div class="hub"></div>
        <div class="read"><b id="hrs">0h</b><span>since posting</span></div></div>
      <div class="stamp"><b>Beat 3.4×</b><span>my usual views</span></div>
    </div>
    <div class="info">
      <div class="av"></div>
      <div><div class="h">＠marlow.studies</div><div class="when">Posted Sunday, 7:10 PM</div></div>
      <div class="pill">Posted</div>
    </div>
  </div>
</div></div>

<script>
const D=10000,stage=document.getElementById('stage');
const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1920));
addEventListener('resize',fit);fit();
let ref;const all=()=>document.getAnimations();
const seek=ms=>all().forEach(a=>a.currentTime=ms);
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){seek(0);all().forEach(a=>a.play())}
  if(e.code==='Space'&&ref){e.preventDefault();const p=ref.playState==='paused';all().forEach(a=>p?a.play():a.pause())}
});

const clock=document.getElementById('clock'),hand=document.getElementById('hand'),hrs=document.getElementById('hrs');
function frame(ms){
  const f=Math.max(0,Math.min(1,(ms-1800)/3400)),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
  clock.style.setProperty('--p',e);
  hand.style.transform=`rotate(${e*4}turn)`;   // one turn per 12 hours
  hrs.textContent=Math.round(e*48)+'h';
}

document.fonts.ready.then(()=>{
  stage.classList.add('go');ref=stage.getAnimations()[0];
  const q=parseFloat(new URLSearchParams(location.search).get('t'));
  if(!isNaN(q)){seek(q*1000);all().forEach(a=>a.pause())}
  requestAnimationFrame(function loop(){frame((ref.currentTime||0)%D);requestAnimationFrame(loop)});
});
</script>
</body>
</html>
