<!-- Supabase Auth template: Confirm signup.
     Paste into Dashboard → Authentication → Emails → Confirm signup.
     (Only used if email confirmations are turned on — currently off, but keep
     the template in place so flipping the switch never sends the stock email.)
     Suggested subject: Confirm your TRND account -->
<div style="background:#f6f4ee;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;">
    <div style="margin-bottom:20px;">
      <span style="display:inline-block;width:11px;height:11px;border-radius:999px;background:#1ea7ae;vertical-align:middle;"></span>
      <span style="font-size:17px;font-weight:700;letter-spacing:6px;color:#23201a;vertical-align:middle;padding-left:10px;">TRND</span>
    </div>
    <div style="background:#ffffff;border:1px solid #e3dfd1;border-radius:14px;padding:32px 28px;">
      <h1 style="margin:0 0 10px;font-size:21px;color:#23201a;">Welcome to TRND</h1>
      <p style="margin:0 0 24px;font-size:14.5px;line-height:1.65;color:#5d564a;">
        Confirm your email and TRND starts reading your market — your first judged
        recommendation is minutes away.
      </p>
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#d99a12;color:#2b1b08;font-weight:600;font-size:15px;text-decoration:none;padding:12px 26px;border-radius:999px;">
        Confirm my email →
      </a>
      <p style="margin:24px 0 0;font-size:12.5px;line-height:1.6;color:#6f6759;">
        Didn't create a TRND account? Ignore this email and nothing happens.
      </p>
    </div>
    <p style="margin:18px 4px 0;font-size:12px;line-height:1.6;color:#6f6759;">
      TRND — know what to advertise, before your competitors do.<br />
      <a href="https://www.usetrnd.com" style="color:#8a6208;">usetrnd.com</a>
    </p>
  </div>
</div>
